[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "voicescribe"
dynamic = ["version"]
description = "Configurable speech-to-text pipeline: local Whisper or Deepgram diarization, LLM copy-editing, TXT/JSON/SRT export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Murat Gölyeri" }]
keywords = ["speech-to-text", "transcription", "whisper", "deepgram", "diarization", "llm", "subtitles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = ["python-dotenv>=1.0", "tqdm>=4.66"]

[project.optional-dependencies]
whisper = ["openai-whisper>=20240930"]
deepgram = ["requests>=2.31"]
llm = ["openai>=1.40"]
all = ["voicescribe[whisper,deepgram,llm]"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.7"]

[project.scripts]
voicescribe = "voicescribe.cli:main"

[project.urls]
Homepage = "https://github.com/Muratglyr/voicescribe"
Issues = "https://github.com/Muratglyr/voicescribe/issues"

[tool.hatch.version]
path = "src/voicescribe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voicescribe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["voicescribe"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "RET", "ARG"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["voicescribe"]

[[tool.mypy.overrides]]
module = ["whisper.*", "tqdm.*", "dotenv.*", "requests.*", "openai.*"]
ignore_missing_imports = true
